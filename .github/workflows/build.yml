name: 🏗️ Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # workflow_run:
  #   workflows: ["test"]
  #   branches: [main]
  #   types:
  #     - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_release:
    permissions:
      contents: write
      pull-requests: write
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release_please.outputs.release_created }}
      release_tag: ${{ steps.release_please.outputs.tag_name }}
      app_version: ${{ steps.set_version.outputs.app_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Run release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release_please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: 'true'
          persist-credentials: false

      - name: Set app version
        id: set_version
        run: |
          if [ -n "${{ steps.release_please.outputs.tag_name }}" ]; then
            RAW_VERSION="${{ steps.release_please.outputs.tag_name }}"
          else
            RAW_VERSION="$(git describe --tags --always --long --dirty)"
          fi

          # Replace any character that isn't [a-zA-Z0-9_.-] with '-'
          SAFE_VERSION=$(echo "$RAW_VERSION" | sed -e 's/[^a-zA-Z0-9_.-]/-/g')

          # Tags can't start with '.' or '-'
          SAFE_VERSION=$(echo "$SAFE_VERSION" | sed -e 's/^[.-]*//')

          # Enforce 128 char max
          SAFE_VERSION=$(echo "$SAFE_VERSION" | cut -c1-128)

          echo "Version: ${SAFE_VERSION}"

          echo "app_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"

  build_apk:
    name: Build apk
    needs: check_release
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: 'true'
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install node packages
        run: |
          npm clean-install

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'tools platform-tools build-tools;34.0.0 cmdline-tools;latest platforms;android-34'

      - name: Configure Bubblewrap
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/android.keystore

      - name: Cache Gradle packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Set version code
        run: |
          sed -i "s/\"appVersionName\": \"[^\"]*\"/\"appVersionName\": \"${{ needs.check_release.outputs.app_version }}\"/" android/twa-manifest.json

      - name: Inject secrets into twa-manifest
        run: |
          sed -i \
            -e 's|__ANDROID_KEYSTORE_PATH__|android/android.keystore|g' \
            -e 's|__ANDROID_KEYSTORE_ALIAS__|${{ secrets.ANDROID_KEYSTORE_ALIAS }}|g' \
            -e 's|__ANDROID_KEYSTORE_FINGERPRINT__|${{ secrets.ANDROID_KEYSTORE_FINGERPRINT }}|g' \
            -e 's|__FORAGD_BASEURL__|${{ env.FORAGD_BASEURL }}|g' \
            android/twa-manifest.json
        env:
          FORAGD_BASEURL: 'https://foragd.app'

      - name: Bubblewrap update
        working-directory: android
        run: |
          npx bubblewrap update \
            --skipVersionUpgrade

      - name: Bubblewrap build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx bubblewrap build \
            --signingKeyPath android.keystore \
            --signingKeyAlias android \
            --signingKeyPassword "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            --signingKeyAliasPassword "$BUBBLEWRAP_KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foragd-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/android.keystore
          rm -f android/twa-manifest.json
