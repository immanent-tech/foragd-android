services:
  devcontainer:
    env_file:
      - ../.env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - /etc/localtime:/etc/localtime:ro,cached
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:rw
    command: -c 'sleep infinity'
    user: vscode
    init: true
    group_add:
      - keep-groups
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    hostname: devcontainer
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
