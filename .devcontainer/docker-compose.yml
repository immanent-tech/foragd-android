services:
  devcontainer:
    env_file:
      - ../.env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
      - foragd-android-node_modules:/workspace/node_modules
      - foragd-android-gradle:/workspace/.gradle
      - foragd-android-build:/workspace/build
      - foragd-android-datahome:/datahome
      - /etc/localtime:/etc/localtime:ro
    command: -c 'sleep infinity'
    user: ubuntu
    init: true
    group_add:
      - keep-groups
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    hostname: devcontainer
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
volumes:
  foragd-android-datahome:
  foragd-android-node_modules:
  foragd-android-gradle:
  foragd-android-build:

